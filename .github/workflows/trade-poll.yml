# Hourly backstop for incoming ESPN trade offers.
#
# Primary path: a Google Apps Script doorbell (scripts/gmail_trade_doorbell.gs) fires the "FF trade offer"
# routine within a minute of ESPN's "Trade Proposal" email. This workflow is the backstop in case the
# doorbell is silent: it asks ESPN for recently proposed offers and fires the same routine for any offer id
# it has not fired before (ids are persisted with actions/cache, so a wide window never causes duplicate
# emails). The morning briefing is the final net: it lists every still-pending offer.
#
# The schedule is a plain hourly cron; the in-season / quiet-hours gate is scripts/trade_poll_gate.py (Denver
# time, tested in tests/test_trade_poll_gate.py), because GitHub rejects month/day lists mixed with ranges and its
# scheduler often runs late. Scheduled runs poll Sep-Jan, every weekday, except 1-5 AM Denver; the 6 AM briefing
# covers the small hours. Until 2026-10-08 the gate skipped Monday and UTC hours 0-11, which was every Denver
# evening from 6 PM MDT on (TODO C3).
#
# The window is 6h, not the hour the cron asks for, because GitHub does not honor the cron on a quiet repo:
# observed scheduled runs land roughly 3h apart (16:32, 19:44, 22:40 UTC on 2026-09-18). A 75-minute window
# against a 3-hour cadence covered under half the day and silently dropped the rest. The window only has to
# exceed the real gap between runs; id-dedupe means overlapping it costs nothing.
name: trade-poll
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'How far back counts as new (e.g. 6h, 48h)'
        default: '6h'
concurrency:
  group: trade-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to run (in season, not 1-5 AM Denver; manual runs always run)
        id: gate
        run: python3 scripts/trade_poll_gate.py --event "${{ github.event_name }}"
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true
      - if: steps.gate.outputs.run == 'true'
        run: uv python install 3.13 && uv sync --quiet
      - name: Restore the set of offer ids already fired
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: seen_ids.txt
          key: trade-poll-seen-${{ github.run_id }}
          restore-keys: trade-poll-seen-
      - name: Write .env and leagues.toml from secrets/variables
        if: steps.gate.outputs.run == 'true'
        run: |
          printf 'ESPN_S2=%s\nSWID=%s\nSEASON=%s\n' "$ESPN_S2" "$SWID" "${SEASON:-2026}" > .env
          case "$LEAGUES_TOML" in *"[[league]]"*) printf '%s\n' "$LEAGUES_TOML" > leagues.toml ;; *) printf '%s' "$LEAGUES_TOML" | tr -d ' \r\n\t' | base64 -d > leagues.toml ;; esac
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON: ${{ vars.SEASON }}
          LEAGUES_TOML: ${{ vars.LEAGUES_TOML }}
      - name: Look for new offers
        id: look
        if: steps.gate.outputs.run == 'true'
        run: |
          uv run ff incoming --json --new-since "${{ github.event.inputs.window || '6h' }}" > all.json
          touch seen_ids.txt
          python3 - <<'PY'
          import json
          seen = {l.strip() for l in open("seen_ids.txt") if l.strip()}
          offers = json.load(open("all.json"))
          new = [o for o in offers if str(o.get("id")) not in seen]
          json.dump(new, open("new.json", "w"))
          print(f"{len(offers)} offer(s) in window, {len(new)} not yet fired")
          for o in new:
              print(json.dumps(o))
          PY
          echo "count=$(python3 -c 'import json;print(len(json.load(open("new.json"))))')" >> "$GITHUB_OUTPUT"
        env:
          NFLREADPY_TIMEOUT: '120'
      - name: Fire the trade-offer routine
        if: steps.gate.outputs.run == 'true' && steps.look.outputs.count != '0'
        run: |
          python3 - <<'PY'
          import json
          offers = json.load(open("new.json"))
          lines = [f"{o['league']} ({o['league_name']}): {o['rival']} offers {', '.join(o['get'])} for {', '.join(o['give'])}; verdict {o['verdict']}" for o in offers]
          json.dump({"text": "New incoming ESPN trade offer(s):\n" + "\n".join(lines)}, open("payload.json", "w"))
          PY
          curl --fail --silent --show-error -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_ID}/fire" \
            -H "Authorization: Bearer ${FF_ROUTINE_FIRE_TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data @payload.json
          # Only after a successful fire do the ids count as seen.
          python3 -c 'import json;[print(o["id"]) for o in json.load(open("new.json"))]' >> seen_ids.txt
          tail -n 500 seen_ids.txt > seen_ids.tmp && mv seen_ids.tmp seen_ids.txt
        env:
          ROUTINE_ID: ${{ vars.FF_TRADE_ROUTINE_ID }}
          FF_ROUTINE_FIRE_TOKEN: ${{ secrets.FF_ROUTINE_FIRE_TOKEN }}
      - name: Save the set of offer ids already fired
        if: steps.gate.outputs.run == 'true' && steps.look.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: seen_ids.txt
          key: trade-poll-seen-${{ github.run_id }}

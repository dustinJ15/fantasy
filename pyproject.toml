[project]
name = "ff"
version = "0.1.0"
description = "Fantasy football AI co-manager: deterministic analytics for ESPN leagues, Claude reads the news."
requires-python = ">=3.12,<3.14"
dependencies = [
    "espn-api==0.46.0",
    "nflreadpy @ git+https://github.com/nflverse/nflreadpy",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "scipy>=1.13",
    "python-dotenv>=1.0",
    "markdown>=3.10.3",
]

[project.scripts]
ff = "ff.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
